services:
  # 1. FastAPI Backend + ML & Computer Vision Engine
  - type: web
    name: landarena-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r apps/api/requirements.txt"
    startCommand: "uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./land_intel.db
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production

  # 2. Next.js 14 Web Portal (Botanical UI & GIS Maps)
  - type: web
    name: landarena-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: "npm --prefix apps/web install && npm --prefix apps/web run build"
    startCommand: "npm --prefix apps/web run start"
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: BACKEND_API_URL
        fromService:
          type: web
          name: landarena-api
          property: host
